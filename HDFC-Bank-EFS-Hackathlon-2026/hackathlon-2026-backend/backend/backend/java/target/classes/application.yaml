spring:
  application:
    name: membershipProgram
  profiles:
    active: local

  # H2 Database Connection Settings
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # Enable H2 Console web interface
  h2:
    console:
      enabled: true
      path: /h2-console